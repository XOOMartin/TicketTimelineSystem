# PostgreSQL for the Ticket Timeline server.
#   docker compose up -d
# then run the server with
#   DATABASE_URL=postgres://ticket_timeline:<password>@localhost:5432/ticket_timeline?sslmode=disable
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_timeline
      POSTGRES_USER: ticket_timeline
      # Set POSTGRES_PASSWORD in a .env file next to this one (not committed).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Only reachable from this machine; the Go server connects locally.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_timeline -d ticket_timeline"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
